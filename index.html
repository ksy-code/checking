<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영업 거래처 관리</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --primary-dark: #3730a3;
      --success: #059669;
      --success-light: #d1fae5;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --info: #0284c7;
      --info-light: #e0f2fe;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
      --shadow: 0 4px 16px rgba(0,0,0,.1);
      --shadow-lg: 0 8px 32px rgba(0,0,0,.14);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
      background: white;
      border-bottom: 1px solid var(--gray-200);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      height: 64px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      color: var(--gray-900);
      white-space: nowrap;
    }
    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--primary), #818cf8);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }
    .search-wrap {
      flex: 1;
      position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 9px 16px 9px 40px;
      border: 1.5px solid var(--gray-200);
      border-radius: 40px;
      font-size: 14px;
      outline: none;
      background: var(--gray-50);
      transition: border-color .2s, box-shadow .2s;
    }
    .search-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.1);
      background: white;
    }
    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: 16px;
    }
    .btn-add {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, transform .1s;
    }
    .btn-add:hover { background: var(--primary-dark); }
    .btn-add:active { transform: scale(.97); }

    /* ─── Main Layout ─── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    /* ─── Stats ─── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-200);
    }
    .stat-label { font-size: 12px; color: var(--gray-500); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .stat-value { font-size: 30px; font-weight: 700; margin-top: 6px; color: var(--gray-900); }
    .stat-sub { font-size: 12px; color: var(--gray-400); margin-top: 4px; }

    /* ─── Filters ─── */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      align-items: center;
    }
    .filter-label { font-size: 13px; color: var(--gray-500); font-weight: 500; margin-right: 4px; }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--gray-200);
      background: white;
      font-size: 13px;
      color: var(--gray-600);
      cursor: pointer;
      transition: all .2s;
      font-weight: 500;
    }
    .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
    .filter-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* ─── Sort & Count ─── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .list-count { font-size: 14px; color: var(--gray-500); }
    .list-count strong { color: var(--gray-800); }
    .sort-select {
      padding: 5px 10px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      font-size: 13px;
      color: var(--gray-600);
      background: white;
      cursor: pointer;
      outline: none;
    }

    /* ─── Cards ─── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: var(--radius);
      border: 1.5px solid var(--gray-200);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s, border-color .2s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .card:hover { box-shadow: var(--shadow); border-color: var(--gray-300); }
    .card.mine::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--primary);
      border-radius: 4px 0 0 4px;
    }
    .card.senior::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--warning);
      border-radius: 4px 0 0 4px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .card-company {
      font-size: 16px;
      font-weight: 700;
      color: var(--gray-900);
      line-height: 1.3;
    }
    .card-person {
      font-size: 13px;
      color: var(--gray-500);
      margin-top: 2px;
    }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; }
    .badge-contact     { background: #ede9fe; color: #6d28d9; }
    .badge-contact .badge-dot { background: #7c3aed; }
    .badge-proposal    { background: var(--info-light); color: var(--info); }
    .badge-proposal .badge-dot { background: var(--info); }
    .badge-meeting     { background: var(--warning-light); color: var(--warning); }
    .badge-meeting .badge-dot { background: var(--warning); }
    .badge-negotiating { background: #fce7f3; color: #be185d; }
    .badge-negotiating .badge-dot { background: #db2777; }
    .badge-closed      { background: var(--success-light); color: var(--success); }
    .badge-closed .badge-dot { background: var(--success); }
    .badge-hold        { background: var(--gray-100); color: var(--gray-500); }
    .badge-hold .badge-dot { background: var(--gray-400); }

    .owner-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      margin-right: 4px;
    }
    .owner-mine   { background: var(--primary-light); color: var(--primary); }
    .owner-senior { background: var(--warning-light); color: var(--warning); }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .card-industry, .card-date {
      font-size: 12px;
      color: var(--gray-400);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .card-memo {
      font-size: 13px;
      color: var(--gray-600);
      background: var(--gray-50);
      border-radius: 8px;
      padding: 8px 12px;
      line-height: 1.5;
      min-height: 36px;
      word-break: keep-all;
    }
    .card-memo.empty { color: var(--gray-300); font-style: italic; }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      justify-content: flex-end;
    }
    .btn-sm {
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-edit { border-color: var(--gray-200); color: var(--gray-600); background: white; }
    .btn-edit:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .btn-del  { border-color: var(--gray-200); color: var(--gray-400); background: white; }
    .btn-del:hover  { border-color: var(--danger); color: var(--danger); background: var(--danger-light); }

    /* ─── Empty State ─── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray-400);
    }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 16px; color: var(--gray-500); margin-bottom: 6px; }
    .empty-state p  { font-size: 14px; }

    /* ─── Modal ─── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.45);
      backdrop-filter: blur(3px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: white;
      border-radius: 18px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }

    .modal-header {
      padding: 24px 24px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--gray-900); }
    .btn-close {
      width: 32px; height: 32px;
      border: none; background: var(--gray-100);
      border-radius: 50%; cursor: pointer;
      font-size: 16px; color: var(--gray-500);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .btn-close:hover { background: var(--gray-200); }

    .modal-body { padding: 20px 24px 24px; }

    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 6px;
    }
    .form-group label .req { color: var(--danger); margin-left: 2px; }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-size: 14px;
      color: var(--gray-800);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: white;
    }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.1);
    }
    textarea.form-control { resize: vertical; min-height: 80px; line-height: 1.5; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .dup-warning {
      display: none;
      background: var(--warning-light);
      border: 1px solid #fcd34d;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--warning);
      margin-bottom: 16px;
      font-weight: 500;
    }
    .dup-warning.show { display: block; }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding-top: 4px;
    }
    .btn-cancel {
      padding: 10px 20px;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      background: white;
      color: var(--gray-600);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-cancel:hover { background: var(--gray-50); }
    .btn-submit {
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-submit:hover { background: var(--primary-dark); }

    /* ─── Detail Drawer ─── */
    .drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,.4);
      backdrop-filter: blur(2px);
      z-index: 150;
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: 420px;
      max-width: 100vw;
      background: white;
      box-shadow: var(--shadow-lg);
      z-index: 151;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: none; }
    .drawer-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-body { flex: 1; overflow-y: auto; padding: 24px; }

    .detail-company { font-size: 22px; font-weight: 800; color: var(--gray-900); margin-bottom: 6px; }
    .detail-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }

    .detail-section { margin-bottom: 22px; }
    .detail-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gray-400);
      margin-bottom: 10px;
    }

    .status-select-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .status-option {
      text-align: center;
      padding: 10px 6px;
      border-radius: 10px;
      border: 2px solid var(--gray-200);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-500);
      transition: all .15s;
    }
    .status-option:hover { border-color: var(--primary); color: var(--primary); }
    .status-option.selected { background: var(--primary); border-color: var(--primary); color: white; }
    .status-option .s-emoji { font-size: 18px; display: block; margin-bottom: 4px; }

    .memo-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-size: 13px;
      color: var(--gray-800);
      line-height: 1.6;
      resize: vertical;
      min-height: 100px;
      outline: none;
      transition: border-color .2s;
      font-family: inherit;
    }
    .memo-input:focus { border-color: var(--primary); }

    .btn-save-memo {
      margin-top: 8px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-save-memo:hover { background: var(--primary-dark); }

    .log-list { list-style: none; }
    .log-item {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--gray-100);
    }
    .log-item:last-child { border-bottom: none; }
    .log-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--primary);
      margin-top: 5px;
      flex-shrink: 0;
    }
    .log-text { font-size: 13px; color: var(--gray-700); line-height: 1.5; }
    .log-time { font-size: 11px; color: var(--gray-400); margin-top: 2px; }

    .saved-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--gray-900);
      color: white;
      padding: 10px 24px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      z-index: 300;
      transition: transform .3s;
      white-space: nowrap;
    }
    .saved-toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 720px) {
      header { padding: 0 14px; }
      .header-inner { gap: 10px; height: 56px; }
      .logo span { display: none; }
      .container { padding: 16px 14px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
      .card-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .drawer { width: 100vw; }
      .status-select-group { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<!-- ─── Header ─── -->
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">📊</div>
      <span>영업 거래처 관리</span>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="회사명, 담당자, 업종 검색..." autocomplete="off" />
    </div>
    <button class="btn-add" onclick="openAddModal()">＋ 업체 등록</button>
  </div>
</header>

<!-- ─── Main ─── -->
<div class="container">

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">전체 거래처</div>
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-sub">내 업체 + 선배 업체</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">영업 진행 중</div>
      <div class="stat-value" id="statActive" style="color:var(--primary)">0</div>
      <div class="stat-sub">컨택~협의 단계</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">거래 성사</div>
      <div class="stat-value" id="statClosed" style="color:var(--success)">0</div>
      <div class="stat-sub">계약 완료</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">내 업체</div>
      <div class="stat-value" id="statMine" style="color:var(--info)">0</div>
      <div class="stat-sub">내가 등록한 업체</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <span class="filter-label">필터</span>
    <button class="filter-btn active" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="active">영업 중</button>
    <button class="filter-btn" data-filter="closed">성사</button>
    <button class="filter-btn" data-filter="hold">보류</button>
    <button class="filter-btn" data-filter="mine">내 업체</button>
    <button class="filter-btn" data-filter="senior">선배 업체</button>
  </div>

  <!-- List Header -->
  <div class="list-header">
    <div class="list-count">총 <strong id="visibleCount">0</strong>개 업체</div>
    <select class="sort-select" id="sortSelect">
      <option value="recent">최근 연락순</option>
      <option value="name">회사명순</option>
      <option value="status">상태순</option>
    </select>
  </div>

  <!-- Cards -->
  <div class="card-grid" id="cardGrid">
    <div class="empty-state">
      <div class="empty-icon">🏢</div>
      <h3>거래처를 불러오는 중...</h3>
    </div>
  </div>
</div>

<!-- ─── Add/Edit Modal ─── -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalIfOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">새 업체 등록</div>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="dup-warning" id="dupWarning">
        ⚠️ 이미 등록된 업체명과 유사합니다: <strong id="dupName"></strong>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>회사명 <span class="req">*</span></label>
          <input class="form-control" id="fCompany" placeholder="(주)ABC물산" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>업종</label>
          <input class="form-control" id="fIndustry" placeholder="제조, 유통, IT..." />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>담당자</label>
          <input class="form-control" id="fPerson" placeholder="홍길동 팀장" />
        </div>
        <div class="form-group">
          <label>연락처</label>
          <input class="form-control" id="fPhone" placeholder="010-0000-0000" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>담당자 (나 / 선배)</label>
          <select class="form-control" id="fOwner">
            <option value="mine">나 (내 업체)</option>
            <option value="senior">선배</option>
          </select>
        </div>
        <div class="form-group">
          <label>영업 상태 <span class="req">*</span></label>
          <select class="form-control" id="fStatus">
            <option value="contact">컨택 중</option>
            <option value="proposal">제안서 발송</option>
            <option value="meeting">미팅 완료</option>
            <option value="negotiating">협의 중</option>
            <option value="closed">거래 성사</option>
            <option value="hold">보류</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>메모 (현재 영업 상황)</label>
        <textarea class="form-control" id="fMemo" placeholder="카톡으로 견적 문의 중, 다음 주 미팅 예정 등..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">취소</button>
        <button class="btn-submit" onclick="saveClient()">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- ─── Detail Drawer ─── -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <button class="btn-close" onclick="closeDrawer()">✕</button>
    <div style="display:flex;gap:8px;">
      <button class="btn-sm btn-edit" id="drawerEditBtn" onclick="editFromDrawer()">수정</button>
      <button class="btn-sm btn-del" id="drawerDelBtn" onclick="deleteFromDrawer()">삭제</button>
    </div>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- ─── Toast ─── -->
<div class="saved-toast" id="toast">✅ 저장되었습니다</div>

<script>
// ── Constants ──────────────────────────────────────────────────
const STORAGE_KEY = 'salesClients_v2';

const STATUS_META = {
  contact:     { label: '컨택 중',     cls: 'badge-contact',     emoji: '📞', order: 1 },
  proposal:    { label: '제안서 발송', cls: 'badge-proposal',    emoji: '📄', order: 2 },
  meeting:     { label: '미팅 완료',   cls: 'badge-meeting',     emoji: '🤝', order: 3 },
  negotiating: { label: '협의 중',     cls: 'badge-negotiating', emoji: '💬', order: 4 },
  closed:      { label: '거래 성사',   cls: 'badge-closed',      emoji: '✅', order: 5 },
  hold:        { label: '보류',        cls: 'badge-hold',        emoji: '⏸️', order: 6 },
};

const ACTIVE_STATUSES = new Set(['contact', 'proposal', 'meeting', 'negotiating']);

// ── Seed Data ──────────────────────────────────────────────────
const SEED = [
  {
    id: 's1', company: '(주)한국산업', person: '김철수 부장', phone: '02-1234-5678',
    industry: '제조업', owner: 'senior', status: 'closed',
    memo: '작년부터 거래 중. 분기별 정기 발주.',
    contactDate: '2026-04-20', logs: [], createdAt: '2025-01-10T09:00:00'
  },
  {
    id: 's2', company: '미래유통(주)', person: '이영희 과장', phone: '010-9876-5432',
    industry: '유통', owner: 'senior', status: 'closed',
    memo: '월 1회 정기 미팅. 단가 협의 완료.',
    contactDate: '2026-04-15', logs: [], createdAt: '2025-03-05T09:00:00'
  },
  {
    id: 's3', company: '테크솔루션즈', person: '박민준 대리', phone: '031-555-7890',
    industry: 'IT/소프트웨어', owner: 'senior', status: 'negotiating',
    memo: '시스템 도입 제안서 검토 중. 결정권자 미팅 필요.',
    contactDate: '2026-05-01', logs: [], createdAt: '2026-02-10T09:00:00'
  },
  {
    id: 's4', company: '글로벌트레이드', person: '최지훈 팀장', phone: '02-7777-8888',
    industry: '무역', owner: 'senior', status: 'meeting',
    memo: '지난주 미팅 완료. 샘플 요청 받음.',
    contactDate: '2026-04-28', logs: [], createdAt: '2026-01-20T09:00:00'
  },
  {
    id: 'm1', company: '스마트팩토리(주)', person: '정수연 팀장', phone: '010-1111-2222',
    industry: '제조/자동화', owner: 'mine', status: 'contact',
    memo: '카톡으로 첫 인사 완료. 이번 주 전화 미팅 잡을 예정.',
    contactDate: '2026-05-04', logs: [], createdAt: '2026-05-01T09:00:00'
  },
  {
    id: 'm2', company: '그린에너지(주)', person: '윤재원 대리', phone: '010-3333-4444',
    industry: '에너지', owner: 'mine', status: 'proposal',
    memo: '제안서 발송 완료. 검토 후 연락 주신다고 하심. 카톡으로 팔로업 중.',
    contactDate: '2026-05-03', logs: [], createdAt: '2026-04-25T09:00:00'
  },
  {
    id: 'm3', company: '헬스케어플러스', person: '강나리 과장', phone: '010-5555-6666',
    industry: '의료/헬스케어', owner: 'mine', status: 'meeting',
    memo: '지난주 방문 미팅 완료. 긍정적 반응. 다음 주 임원 보고 후 확정 예정.',
    contactDate: '2026-05-02', logs: [], createdAt: '2026-04-15T09:00:00'
  },
];

// ── State ──────────────────────────────────────────────────────
let clients = [];
let currentFilter = 'all';
let currentSearch = '';
let currentSort = 'recent';
let editingId = null;
let drawerClientId = null;

// ── Init ──────────────────────────────────────────────────────
function init() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    clients = JSON.parse(stored);
  } else {
    clients = SEED.map(c => ({ ...c, logs: [] }));
    save();
  }
  render();
  setupListeners();
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(clients));
}

// ── Render ──────────────────────────────────────────────────────
function getFiltered() {
  let list = [...clients];

  if (currentSearch.trim()) {
    const q = currentSearch.trim().toLowerCase();
    list = list.filter(c =>
      c.company.toLowerCase().includes(q) ||
      (c.person && c.person.toLowerCase().includes(q)) ||
      (c.industry && c.industry.toLowerCase().includes(q)) ||
      (c.memo && c.memo.toLowerCase().includes(q))
    );
  }

  if (currentFilter === 'active')  list = list.filter(c => ACTIVE_STATUSES.has(c.status));
  if (currentFilter === 'closed')  list = list.filter(c => c.status === 'closed');
  if (currentFilter === 'hold')    list = list.filter(c => c.status === 'hold');
  if (currentFilter === 'mine')    list = list.filter(c => c.owner === 'mine');
  if (currentFilter === 'senior')  list = list.filter(c => c.owner === 'senior');

  if (currentSort === 'name')   list.sort((a, b) => a.company.localeCompare(b.company, 'ko'));
  if (currentSort === 'recent') list.sort((a, b) => (b.contactDate || '').localeCompare(a.contactDate || ''));
  if (currentSort === 'status') list.sort((a, b) => STATUS_META[a.status].order - STATUS_META[b.status].order);

  return list;
}

function render() {
  const filtered = getFiltered();
  const grid = document.getElementById('cardGrid');

  // Stats
  document.getElementById('statTotal').textContent  = clients.length;
  document.getElementById('statActive').textContent = clients.filter(c => ACTIVE_STATUSES.has(c.status)).length;
  document.getElementById('statClosed').textContent = clients.filter(c => c.status === 'closed').length;
  document.getElementById('statMine').textContent   = clients.filter(c => c.owner === 'mine').length;
  document.getElementById('visibleCount').textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon">🔍</div>
      <h3>검색 결과가 없습니다</h3>
      <p>다른 검색어나 필터를 시도해 보세요</p>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(c => buildCard(c)).join('');

  grid.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.btn-sm')) return;
      openDrawer(el.dataset.id);
    });
  });
}

function buildCard(c) {
  const sm = STATUS_META[c.status];
  const ownerLabel = c.owner === 'mine'
    ? `<span class="owner-badge owner-mine">내 업체</span>`
    : `<span class="owner-badge owner-senior">선배 업체</span>`;
  const memo = c.memo
    ? `<div class="card-memo">${escHtml(c.memo)}</div>`
    : `<div class="card-memo empty">메모 없음</div>`;
  const dateStr = c.contactDate
    ? `<span class="card-date">📅 ${c.contactDate}</span>`
    : '';
  const industryStr = c.industry
    ? `<span class="card-industry">🏭 ${escHtml(c.industry)}</span>`
    : '';

  return `<div class="card ${c.owner}" data-id="${c.id}">
    <div class="card-top">
      <div>
        <div class="card-company">${escHtml(c.company)}</div>
        ${c.person ? `<div class="card-person">👤 ${escHtml(c.person)}${c.phone ? ' · ' + escHtml(c.phone) : ''}</div>` : ''}
      </div>
      <span class="badge ${sm.cls}"><span class="badge-dot"></span>${sm.label}</span>
    </div>
    <div class="card-meta">
      ${ownerLabel}
      ${industryStr}
      ${dateStr}
    </div>
    ${memo}
    <div class="card-actions">
      <button class="btn-sm btn-edit" onclick="openEditModal('${c.id}')">✏️ 수정</button>
      <button class="btn-sm btn-del" onclick="confirmDelete('${c.id}')">🗑 삭제</button>
    </div>
  </div>`;
}

// ── Detail Drawer ──────────────────────────────────────────────
function openDrawer(id) {
  const c = clients.find(x => x.id === id);
  if (!c) return;
  drawerClientId = id;

  const sm = STATUS_META[c.status];
  const ownerLabel = c.owner === 'mine'
    ? `<span class="owner-badge owner-mine">내 업체</span>`
    : `<span class="owner-badge owner-senior">선배 업체</span>`;

  const statusOptions = Object.entries(STATUS_META).map(([key, meta]) => `
    <div class="status-option ${c.status === key ? 'selected' : ''}" data-status="${key}" onclick="changeStatus('${id}', '${key}', this)">
      <span class="s-emoji">${meta.emoji}</span>${meta.label}
    </div>`).join('');

  const logItems = (c.logs || []).slice().reverse().map(l => `
    <li class="log-item">
      <div class="log-dot"></div>
      <div>
        <div class="log-text">${escHtml(l.text)}</div>
        <div class="log-time">${l.date}</div>
      </div>
    </li>`).join('') || `<li style="color:var(--gray-300);font-size:13px;padding:8px 0">기록 없음</li>`;

  document.getElementById('drawerBody').innerHTML = `
    <div class="detail-company">${escHtml(c.company)}</div>
    <div class="detail-meta">
      ${ownerLabel}
      <span class="badge ${sm.cls}"><span class="badge-dot"></span>${sm.label}</span>
      ${c.industry ? `<span style="font-size:12px;color:var(--gray-400)">🏭 ${escHtml(c.industry)}</span>` : ''}
    </div>
    ${c.person ? `<div style="font-size:14px;color:var(--gray-600);margin-bottom:6px">👤 ${escHtml(c.person)}${c.phone ? ' &nbsp;📞 ' + escHtml(c.phone) : ''}</div>` : ''}
    ${c.contactDate ? `<div style="font-size:13px;color:var(--gray-400);margin-bottom:20px">마지막 연락: ${c.contactDate}</div>` : ''}

    <div class="detail-section">
      <div class="detail-section-title">영업 상태 변경</div>
      <div class="status-select-group">${statusOptions}</div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">영업 메모 업데이트</div>
      <textarea class="memo-input" id="drawerMemo" placeholder="현재 진행 상황을 입력하세요...">${escHtml(c.memo || '')}</textarea>
      <button class="btn-save-memo" onclick="saveMemo('${id}')">메모 저장 (로그에 기록)</button>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">영업 로그 (${(c.logs || []).length}건)</div>
      <ul class="log-list">${logItems}</ul>
    </div>
  `;

  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  drawerClientId = null;
}

function changeStatus(id, status, el) {
  const c = clients.find(x => x.id === id);
  if (!c) return;
  const prevLabel = STATUS_META[c.status].label;
  c.status = status;
  c.contactDate = today();
  addLog(c, `상태 변경: ${prevLabel} → ${STATUS_META[status].label}`);
  save();
  render();
  el.closest('.status-select-group').querySelectorAll('.status-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  showToast('상태가 저장되었습니다');
}

function saveMemo(id) {
  const c = clients.find(x => x.id === id);
  if (!c) return;
  const newMemo = document.getElementById('drawerMemo').value.trim();
  if (newMemo && newMemo !== c.memo) {
    addLog(c, newMemo);
  }
  c.memo = newMemo;
  c.contactDate = today();
  save();
  render();
  openDrawer(id);
  showToast('메모가 저장되었습니다');
}

function editFromDrawer() {
  if (drawerClientId) openEditModal(drawerClientId);
}
function deleteFromDrawer() {
  if (drawerClientId) { closeDrawer(); confirmDelete(drawerClientId); }
}

// ── Add / Edit Modal ───────────────────────────────────────────
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '새 업체 등록';
  ['fCompany','fIndustry','fPerson','fPhone','fMemo'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fOwner').value = 'mine';
  document.getElementById('fStatus').value = 'contact';
  document.getElementById('dupWarning').classList.remove('show');
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('fCompany').focus(), 100);
}

function openEditModal(id) {
  const c = clients.find(x => x.id === id);
  if (!c) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '업체 정보 수정';
  document.getElementById('fCompany').value  = c.company;
  document.getElementById('fIndustry').value = c.industry || '';
  document.getElementById('fPerson').value   = c.person || '';
  document.getElementById('fPhone').value    = c.phone || '';
  document.getElementById('fOwner').value    = c.owner;
  document.getElementById('fStatus').value   = c.status;
  document.getElementById('fMemo').value     = c.memo || '';
  document.getElementById('dupWarning').classList.remove('show');
  document.getElementById('modalOverlay').classList.add('open');
  closeDrawer();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  editingId = null;
}
function closeModalIfOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function saveClient() {
  const company = document.getElementById('fCompany').value.trim();
  if (!company) { alert('회사명을 입력하세요.'); return; }

  const data = {
    company,
    industry: document.getElementById('fIndustry').value.trim(),
    person:   document.getElementById('fPerson').value.trim(),
    phone:    document.getElementById('fPhone').value.trim(),
    owner:    document.getElementById('fOwner').value,
    status:   document.getElementById('fStatus').value,
    memo:     document.getElementById('fMemo').value.trim(),
    contactDate: today(),
  };

  if (editingId) {
    const idx = clients.findIndex(c => c.id === editingId);
    const prev = clients[idx];
    if (prev.status !== data.status) {
      addLog(prev, `상태 변경: ${STATUS_META[prev.status].label} → ${STATUS_META[data.status].label}`);
    }
    clients[idx] = { ...prev, ...data };
  } else {
    const dup = clients.find(c =>
      c.company.toLowerCase().replace(/\s/g,'') === company.toLowerCase().replace(/\s/g,'')
    );
    if (dup) {
      document.getElementById('dupName').textContent = dup.company;
      document.getElementById('dupWarning').classList.add('show');
      if (!confirm(`'${dup.company}' 이름의 업체가 이미 있습니다. 그래도 등록하시겠습니까?`)) return;
    }
    clients.push({ id: uid(), ...data, logs: [], createdAt: new Date().toISOString() });
  }

  save();
  render();
  closeModal();
  showToast(editingId ? '수정되었습니다' : '새 업체가 등록되었습니다');
}

// ── Delete ─────────────────────────────────────────────────────
function confirmDelete(id) {
  const c = clients.find(x => x.id === id);
  if (!c) return;
  if (!confirm(`'${c.company}'을(를) 삭제하시겠습니까?`)) return;
  clients = clients.filter(x => x.id !== id);
  save();
  render();
  showToast('삭제되었습니다');
}

// ── Helpers ────────────────────────────────────────────────────
function addLog(c, text) {
  if (!c.logs) c.logs = [];
  c.logs.push({ text, date: new Date().toLocaleString('ko-KR') });
}

function today() {
  return new Date().toISOString().slice(0, 10);
}

function uid() {
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = '✅ ' + msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Event Listeners ────────────────────────────────────────────
function setupListeners() {
  document.getElementById('searchInput').addEventListener('input', e => {
    currentSearch = e.target.value;
    render();
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById('sortSelect').addEventListener('change', e => {
    currentSort = e.target.value;
    render();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeDrawer(); }
  });
}

init();
</script>
</body>
</html>
